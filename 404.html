<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 &mdash; Out of bounds | Swingerz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#146C34">
<meta name="description" content="Page not found. Have a rally while you're here.">
<!-- Declared inline so the browser stops asking for /favicon.ico, which the
     site does not serve. -->

<style>
/* Same face as the site. Loaded from a file rather than inlined: the base64
   copy in index.html is 49KB, and duplicating that into a 404 nobody should
   reach would cost more than the page itself. */
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('/dmsans.woff2') format('woff2');
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  background:#146C34;color:#fff;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px 36px;
  position:relative;overflow-x:hidden;
}
/* Same flat-disc bokeh as the invite card and the app store artwork. */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at  6% 14%, rgba(255,255,255,.075) 0 150px, transparent 150px),
    radial-gradient(circle at 93%  8%, rgba(255,255,255,.055) 0 190px, transparent 190px),
    radial-gradient(circle at 82% 88%, rgba(255,255,255,.07)  0 210px, transparent 210px),
    radial-gradient(circle at 12% 92%, rgba(0,0,0,.05)        0 160px, transparent 160px),
    radial-gradient(circle at 50% 40%, rgba(255,255,255,.035) 0  90px, transparent  90px);
}
main{position:relative;z-index:1;width:100%;max-width:760px;text-align:center}

.code{
  font-size:clamp(64px,15vw,116px);font-weight:800;line-height:.92;
  letter-spacing:-.04em;color:#fff200;
}
h1{
  font-size:clamp(21px,4.6vw,30px);font-weight:800;letter-spacing:-.02em;
  margin-top:6px;
}
.sub{
  font-size:clamp(14px,3.4vw,17px);font-weight:500;line-height:1.45;
  color:rgba(255,255,255,.72);margin-top:10px;
}

/* ── Court ── */
.court-wrap{position:relative;margin:22px auto 0;width:100%;max-width:720px}
canvas{
  display:block;width:100%;aspect-ratio:720/420;
  background:rgba(0,0,0,.16);
  border-radius:16px;
  touch-action:none;              /* we handle drags ourselves */
  cursor:none;
}
canvas:focus-visible{outline:3px solid #fff200;outline-offset:3px}

.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  text-align:center;padding:16px;border-radius:16px;
  background:rgba(4,40,20,.55);
  font-weight:700;letter-spacing:-.01em;
}
.overlay.hidden{display:none}
.overlay .big{font-size:clamp(19px,4.4vw,26px)}
.overlay .small{font-size:clamp(12px,3vw,14px);font-weight:500;color:rgba(255,255,255,.75)}
.serve-btn{
  margin-top:4px;font-family:inherit;font-weight:700;font-size:15px;
  letter-spacing:-.01em;color:#030213;background:#fff200;
  border:none;border-radius:999px;padding:11px 22px;cursor:pointer;
}
.serve-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}

.hint{
  margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:rgba(255,255,255,.45);
}
.home{
  display:inline-block;margin-top:22px;font-size:15px;font-weight:700;
  letter-spacing:-.01em;color:#030213;background:#fff200;
  border-radius:999px;padding:12px 24px;text-decoration:none;
}
.home:focus-visible{outline:3px solid #fff;outline-offset:2px}

@media(max-width:520px){
  .court-wrap{margin-top:16px}
  .hint{font-size:11px}
}

/* ── Landscape phones ──
   Short and wide: stacked, the court alone is taller than the viewport and
   everything below it falls off the bottom. Go two-column - copy on the left,
   court on the right - and size the court from the height that is actually
   left rather than from the width, which there is plenty of. Placement is by
   grid area so the markup order stays correct for portrait and screen
   readers. */
@media(orientation:landscape) and (max-height:560px){
  body{padding:10px 16px;justify-content:center}
  main{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    column-gap:24px;
    align-items:center;
    max-width:none;text-align:left;
  }
  .code{grid-area:1/1;font-size:clamp(30px,11vh,56px)}
  h1{grid-area:2/1;font-size:clamp(14px,4.4vh,21px);margin-top:2px}
  .sub{grid-area:3/1;font-size:clamp(11px,3vh,14px);margin-top:6px;max-width:34ch}
  .home{grid-area:4/1;justify-self:start;margin-top:12px;padding:9px 18px;font-size:13px}
  /* Cap by height so the whole court is on screen; the aspect ratio then
     decides the width. 1.714 is 720/420. */
  .court-wrap{
    grid-area:1/2/5/3;
    margin:0;
    width:100%;
    max-width:min(720px, calc((100dvh - 58px) * 1.714));
    justify-self:end;
  }
  .hint{grid-area:5/2/6/3;justify-self:end;margin-top:6px;font-size:10px}
}
</style>
</head>

  var cv = document.getElementById('court');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');

  /* Logical court units. Everything below is written in these, and the
     canvas transform maps them onto whatever device pixels we end up with,

  var W = 720, H = 420;

  var PADDLE_H = 78, PADDLE_W = 12, PADDLE_INSET = 22;
  var BALL_R = 23;
  var SPEED_START = 330, SPEED_MAX = 760, SPEED_GAIN = 26;
  var PLAYER_KEY_SPEED = 680;
  var CPU_SPEED = 440;          // quicker, but still short of the ball at full pace
  var WIN_SCORE = 7;

  var imgs = FACES.map(function(src){ var i = new Image(); i.src = src; return i; });

  var state, keys = {}, pointerY = null;

  function reset(full){
    if (full) state = { you:0, cpu:0, phase:'ready', rally:0, best:0 };
    state.phase = state.phase === 'over' ? 'over' : state.phase;
    state.player = H/2;
    state.cpuY = H/2;
    state.rally = 0;
    state.ball = { x:W/2, y:H/2, vx:0, vy:0, spin:0, face:0, live:false };
  }
  reset(true);

  function serve(toPlayer){
    var b = state.ball;
    b.x = W/2; b.y = H/2;
    var ang = (Math.random()*0.5 - 0.25);           // shallow opening angle
    var dir = toPlayer ? -1 : 1;
    b.vx = dir * SPEED_START * Math.cos(ang);
    b.vy = SPEED_START * Math.sin(ang);
    b.live = true;
    b.face = (Math.random()*imgs.length)|0;
    state.rally = 0;
  }

  function speedOf(b){ return Math.hypot(b.vx, b.vy); }

    var off = (b.y - paddleY) / (PADDLE_H/2);       // -1 .. 1

    b.vx = dir * sp * Math.cos(ang);
    b.vy = sp * Math.sin(ang);
    b.face = (b.face + 1) % imgs.length;             // change expression on contact
    state.rally++;
    if (state.rally > state.best) state.best = state.rally;
  }

  function point(who){
    state[who]++;
    state.ball.live = false;
    if (state.you >= WIN_SCORE || state.cpu >= WIN_SCORE) {
      state.phase = 'over';
      showOverlay(
        state.you > state.cpu ? 'Game, you.' : 'Game, wall.',
        'You ' + state.you + ' – ' + state.cpu + ' Wall · best rally ' + state.best,
        'Play again'
      );
    } else {
      setTimeout(function(){ if (state.phase === 'playing') serve(who === 'cpu'); }, 700);
    }

    var b = state.ball;

    // Player paddle: pointer wins if present, otherwise keys.
    if (pointerY !== null) {

      if (keys.down) d += 1;

    // capped speed - otherwise it is unbeatable and the joke falls flat.

       now". At full pace on a slow frame the ball covers more ground in one
       step than the paddle is thick, so a proximity test can miss entirely

    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fill();

    } else {
      ctx.fillStyle = '#fff200';
      ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI*2); ctx.fill();
    }
  }

  var last = 0;
  function frame(now){
    if (!last) last = now;
    var dt = Math.min((now - last)/1000, 0.05);      // clamp so tab-switches don't teleport
    last = now;
    if (state.phase === 'playing') step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ── Sizing ──
     Draw in logical units and let the transform absorb both the CSS size and
     the device pixel ratio, so it stays sharp on retina without the game code
     knowing anything about pixels. */
  function fit(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = cv.getBoundingClientRect();
    if (!r.width) return;
    cv.width  = Math.round(r.width * dpr);
    cv.height = Math.round(r.width * (H/W) * dpr);
    ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
    ctx.imageSmoothingQuality = 'high';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ── Input ──
     The paddle is pinned to the left edge, so the separation from the finger
     is horizontal: rest a thumb anywhere to the right of it and the paddle
     stays visible. Because the gap is sideways rather than vertical, no Y
     compensation is needed and touch tracks one to one, which reads as
     direct - a vertical lift traded that away for clearance the layout
     already provides.

     pointerdown still captures the pointer so a drag keeps being delivered
     once the finger leaves the canvas, which is where it goes when chasing a
     ball into a corner. */
  var dragging = false;

  function localY(clientY){
    var r = cv.getBoundingClientRect();
    return (clientY - r.top) / r.height * H;
  }
  function aim(e){ return localY(e.clientY); }

  cv.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch' && !dragging) return;   // no hover on touch
    pointerY = aim(e);
  });
  cv.addEventListener('pointerdown', function(e){
    dragging = true;
    if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch(err){} }
    pointerY = aim(e);
    if (state.phase !== 'playing') start();
  });
  function endDrag(){ dragging = false; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  /* Only give up tracking when a real cursor leaves; during a captured touch
     drag the finger is expected to travel outside the canvas. */
  cv.addEventListener('pointerleave', function(e){
    if (e.pointerType !== 'touch' && !dragging) pointerY = null;
  });

  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { keys.up = true; pointerY = null; e.preventDefault(); }
    if (k === 'arrowdown' || k === 's') { keys.down = true; pointerY = null; e.preventDefault(); }
    if (k === ' ' || k === 'enter') {
      if (state.phase !== 'playing') { e.preventDefault(); start(); }
    }
  });
  window.addEventListener('keyup', function(e){
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') keys.up = false;
    if (k === 'arrowdown' || k === 's') keys.down = false;
  });

  /* ── Overlay ── */
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovSub   = document.getElementById('ov-sub');
  var serveBtn = document.getElementById('serve');

  function showOverlay(title, sub, label){
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    serveBtn.textContent = label;
    overlay.classList.remove('hidden');
  }
  function start(){
    if (state.phase === 'over') reset(true);
    state.phase = 'playing';
    overlay.classList.add('hidden');
    cv.focus({ preventScroll:true });
    serve(Math.random() < 0.5);
  }
  serveBtn.addEventListener('click', function(e){ e.stopPropagation(); start(); });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
