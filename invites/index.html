<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    * {
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-size: 16px;
    }

    body {
      background: #fff;
      color: #030213;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: hidden;
      padding: 40px 24px;
    }

    img,
    picture,
    svg,
    video,
    canvas {
      display: block;
      max-width: 100%;
    }

    input,
    button,
    textarea,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      overflow-wrap: break-word;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :root {
      --color-gray-600: #4a5565;
      --color-gray-900: #101828;
      --color-yellow: #fff200;
      --color-green: #00ad32;
    }

    .logo {
      display: block;
      width: 100%;
      margin: 0 auto;
      aspect-ratio: 4.128312;
      margin-bottom: 32px;
    }

    .cnt {
      max-width: 320px;
      margin: 0 auto;
    }

    .title {
      text-align: center;
      font-size: 16px;
      color: var(--color-gray-600);
      margin-bottom: 12px;
      font-weight: 400;
    }

    .title strong {
      font-weight: 600;
      color: var(--color-gray-900);
    }

    .text {
      color: var(--color-gray-600);
      font-size: 16px;
      text-align: center;
      font-weight: 400;
    }

    .btn {
      background-color: var(--color-yellow);
      color: var(--color-gray-900);
      font-size: 16px;
      font-weight: 700;
      border-radius: 300px;
      height: 48px;
      margin-top: 24px;
      display: block;
      width: 100%;
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto;
      color: var(--color-green);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .group-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .avatar-fallback {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--color-yellow);
      color: var(--color-gray-900);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .group-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-gray-900);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div class="cnt">
    <img src="./logo.svg" class="logo" />
    <div id="app"></div>
  </div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.24.3';
    import { useEffect, useState } from 'https://esm.sh/preact@10.24.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    // Public by design — this is the anon/publishable key, gated by RLS and
    // per-function grants on the Supabase side (see resolve_group_invite's
    // migration), same key EXPO_PUBLIC_SUPABASE_ANON_KEY exposes in the app.
    const SUPABASE_URL = 'https://fiepytipnjfaeolrmnzj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Vd3TK9KlsExyrQe-_A3BnA_CS9vRcrA';
    const APP_STORE_URL = 'https://apps.apple.com/app/6793514887';
    const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.seesawlabs.swingerz';

    const inviteCode = new URLSearchParams(window.location.search).get('code');

    async function resolveInvite(code) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/resolve_group_invite`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ p_code: code }),
      });
      if (!res.ok) return null;
      const rows = await res.json();
      return Array.isArray(rows) ? (rows[0] ?? null) : rows;
    }

    function join() {
      // Format payload — must match CLIPBOARD_INVITE_PREFIX in
      // src/app/_layout.tsx exactly, including the colon.
      const payload = `SWINGERZ_INVITE:${inviteCode}`;
      navigator.clipboard
        .writeText(payload)
        .then(() => {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          window.location.href = isIOS ? APP_STORE_URL : PLAY_STORE_URL;
        })
        .catch(() => alert('Failed to copy code automatically. Please try again.'));
    }

    function App() {
      const [state, setState] = useState({ status: 'loading' });

      useEffect(() => {
        if (!inviteCode) {
          setState({ status: 'invalid', message: 'This invite link is invalid or has already been used.' });
          return;
        }
        resolveInvite(inviteCode)
          .then((invite) => {
            // consumed_by set means someone already used this single-use
            // code — the actual join (accept_group_invite_by_code) re-checks
            // this server-side regardless, but there's no point sending a
            // dead code to the store.
            if (!invite || invite.consumed_by) {
              setState({ status: 'invalid', message: 'This invite link is invalid or has already been used.' });
              return;
            }
            setState({ status: 'ready', invite });
          })
          .catch(() => {
            setState({ status: 'invalid', message: 'This invite link is invalid or has already been used.' });
          });
      }, []);

      const { status, invite, message } = state;

      if (status === 'loading') {
        return html`
          <svg
            class="spinner"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        `;
      }

      if (status === 'invalid') {
        return html`<p class="text">${message}</p>`;
      }

      return html`
        <h1 class="title">
          ${invite.inviter_name
            ? html`<strong>${invite.inviter_name}</strong> invited you to join!`
            : "You've been invited to join!"}
        </h1>

        <div class="group-row">
          ${invite.avatar_url
            ? html`<img class="avatar" src=${invite.avatar_url} alt="" />`
            : html`<div class="avatar-fallback">${invite.name.trim().charAt(0).toUpperCase()}</div>`}
          <span class="group-name">${invite.name}</span>
        </div>

        <button class="btn" onClick=${join}>Join</button>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>

</html>
